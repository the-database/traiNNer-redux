# This is a basic workflow to help you get started with Actions

name: Lint

# Controls when the workflow will run
on:
    # No path filters: these jobs are required checks on master, and a
    # filtered-out workflow never reports, which would block the PR.
    pull_request:
        branches: ['*']
    push:
        branches: [master]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    formatting:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install .[dev]
            - run: ruff format --check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install .[dev]
            - run: ruff check

    pyright:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install .[dev,onnx,scripts]
            - run: pyright
