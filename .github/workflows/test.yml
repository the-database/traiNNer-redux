name: Tests

# Controls when the workflow will run
on:
    # No path filters: Tests is a required check on master, and a filtered-out
    # workflow never reports, which would block the PR.
    pull_request:
        branches: ['*']
    push:
        branches: [master]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: 'pip'
            - run: pip install -e .[dev,onnx,segmentation]
            - run: pytest ./tests

    # Oldest supported Python. Skipped on PRs to keep PR checks fast; runs on
    # push to master and on manual dispatch.
    tests-py312:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: 'pip'
            - run: pip install -e .[dev,onnx,segmentation]
            - run: pytest ./tests
